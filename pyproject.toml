[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "the-void-crosshair"
dynamic = ["version"]
description = "THE VOID CROSSHAIR: a light, Linux-native crosshair overlay for any game or screen (X11 and Wayland)."
readme = "README.md"
license = "MIT"
authors = [{ name = "THE VOID PROTOCOL", email = "thevoidofficialprivacy@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["jeepney>=0.8"]

[project.optional-dependencies]
gui = ["PySide6>=6.8"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
void-crosshair = "void_crosshair.app:main"

[project.gui-scripts]
the-void-crosshair = "void_crosshair.app:gui_main"

[tool.hatch.version]
path = "void_crosshair/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["void_crosshair"]

[tool.hatch.build.targets.sdist]
exclude = [".venv", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
